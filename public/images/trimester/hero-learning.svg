<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="A live online class on a laptop, with a quiz, a progress ring and a certificate">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13306f"/><stop offset="1" stop-color="#0B1F4D"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#030b24" flood-opacity=".35"/></filter>
  </defs>
  <circle cx="320" cy="220" r="190" fill="#ffffff" opacity=".06"/>
  <circle cx="560" cy="70" r="46" fill="#6599FF" opacity=".25"/>
  <!-- laptop -->
  <g filter="url(#sh)">
    <rect x="130" y="84" width="380" height="244" rx="16" fill="#1b2a52"/>
    <rect x="142" y="96" width="356" height="220" rx="8" fill="url(#scr)"/>
    <!-- video area -->
    <rect x="152" y="106" width="206" height="130" rx="8" fill="#0a1740"/>
    <circle cx="255" cy="152" r="22" fill="#DBE6FB"/>
    <path d="M214 214c4-26 20-38 41-38s37 12 41 38z" fill="#6599FF"/>
    <rect x="160" y="114" width="40" height="16" rx="8" fill="#FF5A5F"/><circle cx="170" cy="122" r="3" fill="#fff"/><rect x="177" y="119" width="17" height="5" rx="2.5" fill="#fff"/>
    <!-- participants -->
    <g><rect x="152" y="244" width="62" height="62" rx="8" fill="#13306f"/><circle cx="183" cy="268" r="11" fill="#c98a5b"/><path d="M164 300c2-14 10-20 19-20s17 6 19 20z" fill="#2563EB"/></g>
    <g><rect x="220" y="244" width="62" height="62" rx="8" fill="#13306f"/><circle cx="251" cy="268" r="11" fill="#8d5a3a"/><path d="M232 300c2-14 10-20 19-20s17 6 19 20z" fill="#F5B82E"/></g>
    <g><rect x="288" y="244" width="70" height="62" rx="8" fill="#13306f"/><circle cx="323" cy="268" r="11" fill="#e0a77a"/><path d="M302 300c2-14 12-20 21-20s19 6 21 20z" fill="#6599FF"/></g>
    <!-- code editor -->
    <rect x="366" y="106" width="122" height="200" rx="8" fill="#0d1421"/>
    <rect x="376" y="120" width="40" height="6" rx="3" fill="#6599FF"/><rect x="376" y="136" width="86" height="6" rx="3" fill="#8493B5"/>
    <rect x="386" y="152" width="64" height="6" rx="3" fill="#F5B82E"/><rect x="386" y="168" width="78" height="6" rx="3" fill="#8493B5"/>
    <rect x="386" y="184" width="50" height="6" rx="3" fill="#1FA971"/><rect x="376" y="200" width="30" height="6" rx="3" fill="#6599FF"/>
    <rect x="376" y="226" width="100" height="30" rx="6" fill="#13306f"/><rect x="384" y="237" width="46" height="8" rx="4" fill="#1FA971"/>
    <path d="M90 340h460l-24 26a14 14 0 0 1-10 4H124a14 14 0 0 1-10-4z" fill="#DBE6FB"/>
    <rect x="270" y="340" width="100" height="8" rx="4" fill="#b7c1d9"/>
  </g>
  <!-- floating: quiz -->
  <g filter="url(#sh)"><rect x="28" y="120" width="134" height="104" rx="14" fill="#fff"/>
    <rect x="44" y="136" width="62" height="8" rx="4" fill="#0B1F4D"/>
    <circle cx="52" cy="164" r="7" fill="#1FA971"/><path d="M48.5 164l2.5 2.6 4.5-5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="66" y="160" width="78" height="8" rx="4" fill="#DBE6FB"/>
    <circle cx="52" cy="188" r="7" fill="#DBE6FB"/><rect x="66" y="184" width="62" height="8" rx="4" fill="#DBE6FB"/>
    <circle cx="52" cy="208" r="7" fill="#DBE6FB"/><rect x="66" y="204" width="70" height="8" rx="4" fill="#DBE6FB"/></g>
  <!-- floating: progress ring -->
  <g filter="url(#sh)"><rect x="500" y="132" width="116" height="116" rx="16" fill="#fff"/>
    <circle cx="558" cy="190" r="34" fill="none" stroke="#DBE6FB" stroke-width="10"/>
    <circle cx="558" cy="190" r="34" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round" stroke-dasharray="139 214" transform="rotate(-90 558 190)"/>
    <text x="558" y="196" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1F4D">65%</text></g>
  <!-- floating: certificate -->
  <g filter="url(#sh)"><rect x="470" y="296" width="140" height="98" rx="12" fill="#fff"/>
    <rect x="482" y="308" width="116" height="74" rx="6" fill="none" stroke="#0B1F4D" stroke-width="2" stroke-dasharray="2 3"/>
    <rect x="498" y="322" width="62" height="7" rx="3.5" fill="#0B1F4D"/><rect x="498" y="336" width="84" height="5" rx="2.5" fill="#DBE6FB"/><rect x="498" y="347" width="70" height="5" rx="2.5" fill="#DBE6FB"/>
    <circle cx="576" cy="362" r="12" fill="#F5B82E"/><path d="M570 372l-4 14 10-5 10 5-4-14z" fill="#e59a12"/></g>
</svg>
